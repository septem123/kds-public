name: Monthly Stats

on:
  schedule:
    # 每月1号 UTC 0点运行 (北京时间早上8点)
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 最大运行30分钟
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Cache killmail data
        uses: actions/cache@v4
        with:
          path: cache
          key: killmail-cache-${{ runner.os }}
          restore-keys: |
            killmail-cache-

      - name: Calculate previous month
        id: date
        run: |
          PREV_MONTH=$(date -d "last month" +%m)
          PREV_YEAR=$(date -d "last month" +%Y)
          echo "month=$PREV_MONTH" >> $GITHUB_OUTPUT
          echo "year=$PREV_YEAR" >> $GITHUB_OUTPUT

      - name: Run kill stats
        run: npm run stats -- --year ${{ steps.date.outputs.year }} --month ${{ steps.date.outputs.month }}

      - name: Run loss stats
        run: npm run stats -- --year ${{ steps.date.outputs.year }} --month ${{ steps.date.outputs.month }} --losses

      - name: Update README
        run: |
          cat > /tmp/update_readme.js << 'EOF'
          const fs = require('fs');
          const month = parseInt(process.env.MONTH).toString().padStart(2, '0');
          const year = process.env.YEAR;
          const corpId = '98626718';

          const killFile = 'docs/' + corpId + '-' + year + '-' + month + '.md';
          const lossFile = 'docs/' + corpId + '-' + year + '-' + month + '-losses.md';

          console.log('Reading:', killFile, lossFile);
          console.log('Month:', month, 'Year:', year);

          const killContent = fs.readFileSync(killFile, 'utf8');
          const lossesContent = fs.readFileSync(lossFile, 'utf8');

          // 简单匹配第一行包含数字的行
          const killsFilteredMatch = killContent.match(/总击杀（去蛋[^）]*牵引）[^0-9]*(\d+)/);
          const killsRawMatch = killContent.match(/总击杀（原始）[^0-9]*(\d+)/);
          const lossesMatch = lossesContent.match(/总损失[^0-9]*(\d+)/);

          const killsFiltered = killsFilteredMatch ? killsFilteredMatch[1] : '0';
          const killsRaw = killsRawMatch ? killsRawMatch[1] : '0';
          const losses = lossesMatch ? lossesMatch[1] : '0';

          console.log('killsFiltered:', killsFiltered, 'killsRaw:', killsRaw, 'losses:', losses);

          const newSection = '## ' + year + '-' + month + '\n\n' +
            '**击杀（去蛋/牵引）**: ' + killsFiltered + ' | **击杀（原始）**: ' + killsRaw + ' | **损失**: ' + losses + '\n\n' +
            '[击杀统计](docs/' + corpId + '-' + year + '-' + month + '.md)  [损失统计](docs/' + corpId + '-' + year + '-' + month + '-losses.md)\n\n' +
            '---\n\n';

          const readme = fs.readFileSync('README.md', 'utf8');

          // 在 "KDS开放数据统计" 标题后面插入
          const title = 'KDS开放数据统计';
          const titleIndex = readme.indexOf(title);

          if (titleIndex !== -1) {
            // 找到标题后插入新内容
            const insertPos = titleIndex + title.length;
            const newReadme = readme.slice(0, insertPos) + '\n\n' + newSection + readme.slice(insertPos);
            fs.writeFileSync('README.md', newReadme);
          } else {
            // 如果没找到标题，直接在前面插入
            fs.writeFileSync('README.md', newSection + readme);
          }
          EOF
          node /tmp/update_readme.js
        env:
          MONTH: ${{ steps.date.outputs.month }}
          YEAR: ${{ steps.date.outputs.year }}

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A
          git diff --staged --quiet || git commit -m "docs: add ${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }} stats"

          # Push with token
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
