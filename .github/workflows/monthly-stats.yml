name: Monthly Stats

on:
  schedule:
    # 每月1号 UTC 0点运行 (北京时间早上8点)
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 最大运行30分钟

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Cache killmail data
        uses: actions/cache@v4
        with:
          path: cache
          key: killmail-cache-${{ runner.os }}
          restore-keys: |
            killmail-cache-

      - name: Calculate previous month
        id: date
        run: |
          PREV_MONTH=$(date -d "last month" +%m)
          PREV_YEAR=$(date -d "last month" +%Y)
          echo "month=$PREV_MONTH" >> $GITHUB_OUTPUT
          echo "year=$PREV_YEAR" >> $GITHUB_OUTPUT

      - name: Run kill stats
        run: npm run stats -- --year ${{ steps.date.outputs.year }} --month ${{ steps.date.outputs.month }}

      - name: Run loss stats
        run: npm run stats -- --year ${{ steps.date.outputs.year }} --month ${{ steps.date.outputs.month }} --losses

      - name: Update README
        run: |
          cat > /tmp/update_readme.js << 'EOF'
          const fs = require('fs');
          const month = process.env.MONTH;
          const year = process.env.YEAR;
          const corpId = '98626718';

          const killContent = fs.readFileSync('docs/' + corpId + '-' + year + '-' + month + '.md', 'utf8');
          const lossesContent = fs.readFileSync('docs/' + corpId + '-' + year + '-' + month + '-losses.md', 'utf8');

          const killsFiltered = killContent.match(/总击杀（去蛋\/牵引）[^\\d]*(\\d+)/)?.[1] || '0';
          const killsRaw = killContent.match(/总击杀（原始）[^\\d]*(\\d+)/)?.[1] || '0';
          const losses = lossesContent.match(/总损失[^\\d]*(\\d+)/)?.[1] || '0';

          const newSection = '## ' + year + '-' + month + '\n\n' +
            '**击杀（去蛋/牵引）**: ' + killsFiltered + ' | **击杀（原始）**: ' + killsRaw + ' | **损失**: ' + losses + '\n\n' +
            '[击杀统计](docs/' + corpId + '-' + year + '-' + month + '.md)  [损失统计](docs/' + corpId + '-' + year + '-' + month + '-losses.md)\n\n' +
            '---\n\n';

          const readme = fs.readFileSync('README.md', 'utf8');
          fs.writeFileSync('README.md', newSection + readme);
          EOF
          node /tmp/update_readme.js
        env:
          MONTH: ${{ steps.date.outputs.month }}
          YEAR: ${{ steps.date.outputs.year }}

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A
          git diff --staged --quiet || git commit -m "docs: add ${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }} stats"

          # Push with retry
          for i in 1 2 3; do
            if git push; then
              break
            fi
            sleep 5
          done
