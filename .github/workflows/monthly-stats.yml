name: Monthly Stats

on:
  schedule:
    # 每月1号 UTC 0点运行 (北京时间早上8点)
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 最大运行30分钟

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Cache killmail data
        uses: actions/cache@v4
        with:
          path: cache
          key: killmail-cache-${{ runner.os }}
          restore-keys: |
            killmail-cache-

      - name: Calculate previous month
        id: date
        run: |
          PREV_MONTH=$(date -d "last month" +%m)
          PREV_YEAR=$(date -d "last month" +%Y)
          echo "month=$PREV_MONTH" >> $GITHUB_OUTPUT
          echo "year=$PREV_YEAR" >> $GITHUB_OUTPUT

      - name: Run kill stats
        run: npm run stats -- --year ${{ steps.date.outputs.year }} --month ${{ steps.date.outputs.month }}

      - name: Run loss stats
        run: npm run stats -- --year ${{ steps.date.outputs.year }} --month ${{ steps.date.outputs.month }} --losses

      - name: Update README
        run: |
          MONTH=${{ steps.date.outputs.month }}
          YEAR=${{ steps.date.outputs.year }}
          # Read kill stats to get numbers
          KILLS_FILTERED=$(grep "总击杀（去蛋/牵引）" docs/${CORP_ID}-${YEAR}-${MONTH}.md | grep -oP '\d+' | head -1)
          KILLS_RAW=$(grep "总击杀（原始）" docs/${CORP_ID}-${YEAR}-${MONTH}.md | grep -oP '\d+' | head -1)
          LOSSES=$(grep "总损失" docs/${CORP_ID}-${YEAR}-${MONTH}-losses.md | grep -oP '\d+' | head -1)

          CORP_ID=98626718

          # Create new section for README
          cat > /tmp/new_section.txt << 'SECTION'
## ${YEAR}-${MONTH}

**击杀（去蛋/牵引）**: ${KILLS_FILTERED} | **击杀（原始）**: ${KILLS_RAW} | **损失**: ${LOSSES}

[击杀统计](docs/${CORP_ID}-${YEAR}-${MONTH}.md)  [损失统计](docs/${CORP_ID}-${YEAR}-${MONTH}-losses.md)

---

SECTION

          # Insert after first line (title) in README
          sed -i '1r /tmp/new_section.txt' README.md
        env:
          CORP_ID: 98626718

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A
          git diff --staged --quiet || git commit -m "docs: add ${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }} stats"

          # Push with retry
          for i in 1 2 3; do
            if git push; then
              break
            fi
            sleep 5
          done
